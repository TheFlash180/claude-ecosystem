<svg viewBox="0 0 96 96" xmlns="http://www.w3.org/2000/svg">
  <!-- Notification badge. Android keeps only the alpha channel and paints the
       result white, so this must be a solid silhouette on transparency — a
       thin outline vanishes at 24dp. A down arrow reads instantly at that
       size; the tag outline used in the app icon does not. -->
  <g fill="#FFFFFF">
    <rect x="39" y="14" width="18" height="40" rx="9"/>
    <path d="M48 82 20 50h56z"/>
  </g>
</svg>
