name: Build and Deploy to Pages

on:
  push:
    branches: [main]
  # Deploy is push-to-main only, so a broken build used to be caught only
  # after merge. Running the same build+test on the PR catches it before.
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Keyed on the ref so a PR run can never cancel an in-flight main deploy;
# pushes to main still supersede each other as before.
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Each app's build already typechecks (tsc --noEmit); this runs the
      # unit tests of every workspace that has a test script.
      - name: Run tests
        run: npm test

      - name: Build all apps
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}

      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  # The edge functions are deployed by hand (CLAUDE.md, "Copy of record"), and
  # Supabase's deploy does not typecheck, so nothing else ever compiles them,
  # and a type error would go unnoticed until a cron run failed. This
  # typechecks every function in the repo as Deno would run it. The deploy
  # below does not wait for it: the site does not ship the functions, so a
  # function's types should not hold the site back, but the PR shows it red.
  functions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Typecheck edge functions
        run: npm run check:functions

  deploy:
    needs: build
    # A PR gets the checks, never the live site.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
