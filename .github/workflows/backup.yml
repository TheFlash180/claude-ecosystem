name: Database Backup

# A weekly, encrypted copy of every table in the shared Supabase project's
# public schema, plus the two auth tables that the rows in it point at.
#
# The free plan has no backups you can download and restore yourself, and
# most of this data cannot be re-synced from anywhere: the household's
# transaction history, the baby log, the registry's claims, glovebox dates.
#
# How it works, and why:
# - Logs in as `backup_reader`, a read-only role (see CLAUDE.md, "Backups"),
#   never the main database password. It bypasses RLS because pg_dump refuses
#   to dump a table whose policies would hide rows from it.
# - GitHub runners have no IPv6, so it goes through the session pooler.
#   Which pooler cluster a project lives on is not visible from here, so
#   both eu-central-1 clusters are tried and the one that accepts the login
#   is used.
# - The dump is checked (tooling/backup-check.sh), gzipped and encrypted with
#   BACKUP_PASSPHRASE before it touches disk as an artifact. This repo is
#   public and so are its artifacts to any signed-in GitHub user: unencrypted,
#   the backup would publish the household's finances.
# - Kept as a workflow artifact for 90 days: the last ~13 weeks, each one a
#   complete copy on its own.
#
# Needs two repository secrets: BACKUP_DB_PASSWORD (backup_reader's password)
# and BACKUP_PASSPHRASE (keep a copy somewhere other than GitHub — without it
# every backup is unreadable). Restoring: see CLAUDE.md.
on:
  schedule:
    - cron: '30 1 * * 0' # Sundays 01:30 UTC (03:30 SAST)
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backup
  cancel-in-progress: false

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      stamp: ${{ steps.dump.outputs.stamp }}
    steps:
      - uses: actions/checkout@v7

      - name: Dump, check and encrypt
        id: dump
        env:
          PGPASSWORD: ${{ secrets.BACKUP_DB_PASSWORD }}
          BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
          PROJECT_REF: objkdeagyltvgcuxsnxu
        run: |
          set -euo pipefail
          if [ -z "$PGPASSWORD" ] || [ -z "$BACKUP_PASSPHRASE" ]; then
            echo "::error::Set the BACKUP_DB_PASSWORD and BACKUP_PASSPHRASE repository secrets."
            exit 1
          fi

          # The server is Postgres 17; pg_dump must not be older than it.
          pg() { docker run --rm -e PGPASSWORD -e PGSSLMODE=require postgres:17 "$@"; }
          user="backup_reader.$PROJECT_REF"

          host=""
          for cluster in aws-0-eu-central-1 aws-1-eu-central-1; do
            if pg psql -h "$cluster.pooler.supabase.com" -p 5432 -U "$user" -d postgres \
                 -Atc 'select 1' >/dev/null 2>&1; then
              host="$cluster.pooler.supabase.com"
              break
            fi
          done
          if [ -z "$host" ]; then
            echo "::error::Could not log in as backup_reader on either eu-central-1 pooler. Check BACKUP_DB_PASSWORD."
            exit 1
          fi

          umask 077
          # What goes in, and why it is more than a pg_dump: the comments
          # at the top of tooling/backup-dump.sh.
          export PGHOST="$host" PGPORT=5432 PGUSER="$user" PGDATABASE=postgres PGSSLMODE=require
          export PG_RUN="docker run --rm -i -e PGHOST -e PGPORT -e PGUSER -e PGPASSWORD -e PGDATABASE -e PGSSLMODE postgres:17"
          bash tooling/backup-dump.sh > dump.sql

          bash tooling/backup-check.sh dump.sql

          stamp="$(date -u +%Y-%m-%d)"
          gzip -9 dump.sql
          gpg --batch --yes --pinentry-mode loopback --passphrase-fd 3 \
            --symmetric --cipher-algo AES256 \
            -o "backup-$stamp.sql.gz.gpg" dump.sql.gz 3<<<"$BACKUP_PASSPHRASE"
          rm -f dump.sql.gz
          echo "STAMP=$stamp" >> "$GITHUB_ENV"
          echo "stamp=$stamp" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v7
        with:
          name: db-backup-${{ env.STAMP }}
          path: backup-*.sql.gz.gpg
          retention-days: 90
          if-no-files-found: error
          # Already gzipped and encrypted; compressing again gains nothing.
          compression-level: 0

  # A backup is only as good as its restore, and the first one rehearsed
  # failed at its first public statement. So every backup is restored, the way
  # CLAUDE.md says to, into a throwaway Supabase (database and auth only) on
  # the runner, and checked against the project it came from: every table's
  # row count, and the manifest of grants, RLS, policies, triggers and
  # realtime membership (tooling/restore-check.sh). A red run here means the
  # backup would not have saved you; the artifact is kept either way.
  #
  # The decrypted copy exists only on this runner. The log shows table
  # names, counts and schema facts, never rows: psql reports errors tersely,
  # because a failed COPY's context line would quote a row into a public log.
  restore-check:
    needs: backup
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: db-backup-${{ needs.backup.outputs.stamp }}

      - name: Start a throwaway Supabase
        working-directory: ${{ runner.temp }}
        run: |
          npx -y supabase@2.120.0 init --force > /dev/null
          npx -y supabase@2.120.0 start -x studio,imgproxy,storage-api,realtime,edge-runtime,logflare,vector,supavisor,postgres-meta,mailpit,kong,postgrest

      - name: Restore and compare with the live project
        env:
          BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          set -euo pipefail
          umask 077
          gpg --batch --quiet --pinentry-mode loopback --passphrase-fd 3 \
            -d backup-*.sql.gz.gpg 3<<<"$BACKUP_PASSPHRASE" | gunzip > backup.sql

          export PGHOST=127.0.0.1 PGPORT=54322 PGUSER=postgres PGPASSWORD=postgres PGDATABASE=postgres
          export PG_RUN="docker run --rm -i --network host -e PGHOST -e PGPORT -e PGUSER -e PGPASSWORD -e PGDATABASE -v $PWD:/w -w /w postgres:17"
          $PG_RUN psql -X -q -v ON_ERROR_STOP=1 -v VERBOSITY=terse -f backup.sql > /dev/null
          bash tooling/restore-check.sh backup.sql
          rm -f backup.sql
